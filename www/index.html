.tiny{font-size:12.5px;color:var(--mut);text-align:center;margin:14px 0 0}

.top{padding-top:max(16px,env(safe-area-inset-top))}.foot{padding-bottom:max(20px,env(safe-area-inset-bottom))}

/* ---------- Підбір ---------- */
function ok(r,m){
  const [,ms,ap,,,k,,,,ing]=r;
  if(!ms.includes(m))return false;
  if(!ap.every(a=>S.ap.includes(a)))return false;
  for(const id in ing){const x=I[id];
    if(S.dis.includes(id))return false;
    if(x[3].some(a=>S.al.includes(a)))return false;
    if(S.diet==="veg"&&(x[4]==="meat"||x[4]==="fish"))return false;
    if(S.diet==="fish"&&x[4]==="meat")return false;}
  if(S.diet==="light"&&k>420&&m!=="s")return false;
  return true;
}
const cost1=r=>Object.entries(r[9]).reduce((s,[id,g])=>s+g*I[id][1]/1000,0)*K();
const costR=r=>cost1(r)*portions();
function score(r){let s=Math.random()*2;
  s+=r[3].filter(t=>S.style.includes(t)).length*1.5;
  if(S.diet==="protein")s+=r[6]/12;if(S.diet==="budget")s-=cost1(r)/15;
  if(S.cal){s-=Math.abs(r[5]-S.kcal/S.meals.length)/200}
  return s}
function pick(m,used,excl,day){
  const c=R.map((r,i)=>[r,i]).filter(([r,i])=>ok(r,m)&&i!==excl&&(used[i]||0)<2&&!(day&&day.has(i)));
  if(!c.length)return R.findIndex((r,i)=>ok(r,m)&&!(day&&day.has(i)));
  c.sort((a,b)=>score(b[0])-score(a[0]));return c[0][1]}
function build(){
  const used={},p=[];
  for(const d of [...S.days].sort()){const ds=new Set();for(const m of ["b","l","d","s"].filter(x=>S.meals.includes(x))){
    const i=pick(m,used,-1,ds);if(i<0)continue;ds.add(i);used[i]=(used[i]||0)+1;p.push({d,m,r:i})}}
  return p}
const total=p=>p.reduce((s,x)=>s+costR(R[x.r]),0);
function fit(p,b){
  for(let n=0;n<80&&total(p)>b;n++){
    let best=null,gain=0;
    p.forEach(x=>{const cur=costR(R[x.r]);
      R.forEach((r,i)=>{if(i!==x.r&&ok(r,x.m)&&p.filter(y=>y.r===i).length<3&&!p.some(y=>y.d===x.d&&y.r===i)){const g=cur-costR(r);if(g>gain){gain=g;best=[x,i]}}})});
    if(!best)break;best[0].r=best[1]}
  return p}
const slotCosts=m=>R.filter(r=>ok(r,m)).map(costR).sort((a,b)=>a-b);
function typical(){return S.days.length*S.meals.reduce((s,m)=>{const c=slotCosts(m);return s+(c.length?c[Math.floor(c.length/2)]:0)},0)}
function cheapest(){return S.days.length*S.meals.reduce((s,m)=>{const c=slotCosts(m);return s+(c.length?c[0]:0)},0)}
const plural=(n,a,b,c)=>{const t=n%10,h=n%100;return t===1&&h!==11?a:t>=2&&t<=4&&(h<10||h>=20)?b:c};

  <p class="tiny">Ціни: Держстат, ${PRICE_DATE}; частина позицій — оцінка. Олію, сіль і спеції рахуємо частково.</p>`,btn:"Зібрати мій план",dis:b<min}},
load:()=>({h:`<div class="load"><div class="orb">Лг</div><h1 style="font-size:22px">Збираємо план…</h1>
  <ul>${["Дивимось ціни магазину","Підбираємо рецепти","Рахуємо кошик","Звіряємо з бюджетом","Збираємо план"].map((t,i)=>`<li id="l${i}"><i></i>${t}</li>`).join("")}</ul></div>`,nofoot:1}),
plan:()=>{
  const p=S.plan,t=total(p),b=S.budget,sh=shop(p);
  return{h:`<h1>Твій тиждень готовий!</h1>
  <div class="sum"><div><small>Витрачено з ${fmt(b)} ₴</small><b>${fmt(t)} ₴</b><div class="bar"><i style="width:${Math.min(100,t/b*100)}%"></i></div>${b>t?`<span class="save">заощаджено ${fmt(b-t)} ₴</span>`:""}</div>
  <button data-a="go" data-v="shop"><small>Список покупок</small><b>${sh.length}</b><small>${plural(sh.length,"позиція","позиції","позицій")} ›</small></button></div>
  ${[...new Set(p.map(x=>x.d))].map(d=>{const its=p.filter(x=>x.d===d);return `<div class="dayh">${DAYF[d]}<span>${its.reduce((s,x)=>s+R[x.r][5],0)} ккал на дорослого</span></div>`+
  its.map(x=>{const r=R[x.r],k=p.indexOf(x);return `<div class="meal"><span class="pic ph" style="background:${COL[x.r%COL.length]}">${ini(r[0])}${ph("recipes",r[11])}</span><button class="t" data-a="open" data-v="${k}"><small>${MEALS[x.m]}</small><b>${r[0]}</b><span>${r[4]} хв · ${r[5]} ккал · ${fmt(costR(r))} ₴</span></button><button class="swap" data-a="swap" data-v="${k}" aria-label="Замінити страву">⇄</button></div>`}).join("")}).join("")}
  <div class="row2" style="margin-top:16px"><button class="ghost" data-a="regen">Перезібрати</button><button class="ghost" data-a="restart">Змінити відповіді</button></div>`,btn:"Список покупок"}},
recipe:()=>{
  const x=S.plan[recipe],r=R[x.r],n=rport??Math.round(portions()*10)/10;
  return{h:`<div class="hero ph" style="background:${COL[x.r%COL.length]}">${ini(r[0])}${ph("recipes",r[11])}</div><h1 style="font-size:24px">${r[0]}</h1>
  <p class="sub">${MEALS[x.m]} · ${r[4]} хв · ${fmt(cost1(r)*n)} ₴ на ${num(n)} порц.</p>
  <div class="macro"><div><b>${r[5]}</b><small>ккал</small></div><div><b>${r[6]} г</b><small>білки</small></div><div><b>${r[7]} г</b><small>жири</small></div><div><b>${r[8]} г</b><small>вуглев.</small></div></div>
  <div class="tabs"><button class="${tab==="ing"?"on":""}" data-a="tab" data-v="ing">Інгредієнти</button><button class="${tab==="st"?"on":""}" data-a="tab" data-v="st">Приготування</button></div>
  ${tab==="ing"?`<div class="row"><span class="grow"><b>Порцій</b></span><span class="step"><button data-a="rp" data-d="-1" aria-label="Менше">−</button><output style="width:40px">${num(n)}</output><button class="p" data-a="rp" data-d="1" aria-label="Більше">+</button></span></div>
  ${Object.entries(r[9]).map(([id,g])=>`<div class="ing"><span class="thumb ph">${ph("products",id)}</span><span class="grow">${I[id][0]}</span><b>${qty(id,g*n)}</b></div>`).join("")}`
  :`<ol class="st">${r[10].map(s=>`<li>${s}</li>`).join("")}</ol>`}`,btn:"Замінити страву"}},
shop:()=>{
  const sh=shop(S.plan);const st=STORES.find(s=>s[0]===S.store);
  return{h:`<h1>Список покупок</h1><p class="sub">${sh.length} ${plural(sh.length,"позиція","позиції","позицій")} · ${st?st[1]:""} · ${fmt(total(S.plan))} ₴. Натисни, щоб викреслити.</p>
  ${Object.keys(CATS).map(c=>{const it=sh.filter(x=>I[x.id][2]===c);return it.length?`<div class="cat">${CATS[c]}</div>`+it.map(x=>`<button class="li${S.checked[x.id]?" done":""}" data-a="chk" data-v="${x.id}"><span class="box" style="${S.checked[x.id]?"background:var(--grn);border-color:var(--grn)":""}">${S.checked[x.id]?"✓":""}</span><span class="thumb ph">${ph("products",x.id)}</span><span class="grow">${I[x.id][0]}<small>${qty(x.id,x.g)}${I[x.id][5]?" · ціна орієнтовна":""}</small></span><em>${fmt(x.c)} ₴</em></button>`).join(""):""}).join("")}
  <button class="ghost" style="width:100%;margin-top:16px" data-a="copy" id="cp">Скопіювати список</button>`,btn:"До плану"}}
};
function qty(id,g){const pc=I[id][6];if(pc)return Math.max(1,Math.round(g/pc))+" шт";
  const l=["milk","kefir","oil"].includes(id);return g>=1000?num(Math.round(g/100)/10)+(l?" л":" кг"):Math.round(g/10)*10+(l?" мл":" г")}
function shop(p){const m={};p.forEach(x=>{for(const[id,g]of Object.entries(R[x.r][9])){m[id]=(m[id]||0)+g*portions()}});
  return Object.entries(m).map(([id,g])=>({id,g,c:g*I[id][1]/1000*K()})).sort((a,b)=>b.c-a.c)}

/* ---------- Рендер ---------- */
function render(){
  const v=V[view]();$("main").innerHTML=v.h;$("main").scrollTop=0;
  const si=STEPS.indexOf(view);$("prog").style.width=(si>=0?(si+1)/STEPS.length*100:100)+"%";
  $("back").style.visibility=view==="store"||view==="load"||view==="plan"?"hidden":"visible";
  $("foot").innerHTML=v.nofoot?"":`<button class="cta" data-a="next"${v.dis?" disabled":""}>${v.btn||"Далі"}</button>`;
  const b=$("bud"),r=$("rng");
  if(b){const set=x=>{S.budget=Math.max(0,Math.round(+x||0));save()};
    r.oninput=()=>{set(r.value);b.value=S.budget;softBudget()};b.onchange=()=>{set(b.value);render()};}
  const kc=$("kcal");if(kc)kc.onchange=()=>{S.kcal=Math.min(4000,Math.max(1000,+kc.value||2000));save()};
}
let tmr;function softBudget(){clearTimeout(tmr);tmr=setTimeout(()=>{const y=document.activeElement&&document.activeElement.id;render();if(y&&$(y))$(y).focus()},250)}
function go(v){view=v;render()}
function generate(){go("load");let i=0;const t=setInterval(()=>{const el=$("l"+i);if(el)el.classList.add("ok");i++;
  if(i>5){clearInterval(t);S.plan=fit(build(),S.budget);S.checked={};save();go("plan")}},450)}
function swap(k){const x=S.plan[k];const used={};S.plan.forEach(y=>used[y.r]=(used[y.r]||0)+1);
  const i=pick(x.m,used,x.r,new Set(S.plan.filter(y=>y.d===x.d).map(y=>y.r)));if(i>=0)x.r=i;save()}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==="next"){
    if(view==="budget")return generate();
    if(view==="plan")return go("shop");
    if(view==="shop")return go("plan");
    if(view==="recipe"){swap(recipe);return render()}
    return go(STEPS[STEPS.indexOf(view)+1]);}
  if(a==="store")S.store=v;
  if(a==="cnt"){const k=el.dataset.k;S[k]=Math.max(0,Math.min(10,S[k]+ +el.dataset.d))}
  if(a==="meal")S.meals=tog(S.meals,v);
  if(a==="day")S.days=tog(S.days,+v);
  if(a==="ap")S.ap=tog(S.ap,v);
  if(a==="diet")S.diet=v;
  if(a==="style")S.style=tog(S.style,v);
  if(a==="cal")S.cal=v==="1";
  if(a==="al")S.al=tog(S.al,v);if(a==="alnone")S.al=[];
  if(a==="dis")S.dis=tog(S.dis,v);
  if(a==="open"){recipe=+v;tab="ing";rport=null;return go("recipe")}
  if(a==="swap")swap(+v);
  if(a==="tab")tab=v;
  if(a==="rp"){const n=rport??Math.round(portions()*10)/10;rport=Math.max(1,Math.round(n+ +el.dataset.d))}
  if(a==="go")return go(v);
  if(a==="regen")return generate();
  if(a==="restart"){S.budget=null;return go("store")}
  if(a==="chk")S.checked[v]=!S.checked[v];
  if(a==="copy"){const t=shop(S.plan).map(x=>`${I[x.id][0]} — ${qty(x.id,x.g)}`).join("\n");
    navigator.clipboard.writeText(t).then(()=>{$("cp").textContent="Скопійовано"},()=>{$("cp").textContent="Не вдалося скопіювати"});return}
  if(STEPS.includes(view)&&view!=="budget")S.budget=null;
  save();render();
});
$("back").onclick=()=>{if(view==="recipe"||view==="shop")return go("plan");const i=STEPS.indexOf(view);if(i>0)go(STEPS[i-1])};
render();
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}

</script>
</body>
</html>
