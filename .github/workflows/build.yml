name: Зібрати застосунок

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - name: Іконка застосунку
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffd96a' --splashBackgroundColor '#ffd96a'
      - run: npx cap sync android
      - name: Збірка APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Legkist.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Legkist-android
          path: Legkist.apk
      - name: Опублікувати APK у розділі Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Legkist.apk --title "Легкість для Android" --notes "Завантажте Legkist.apk на телефон і відкрийте файл, щоб встановити."

  web:
    name: Веб-версія для iPhone (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
